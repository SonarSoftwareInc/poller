server {
    listen 80;
    listen [::]:80;

    include /etc/nginx/mime.types;

    root /usr/share/sonar_poller/www;

    location / {
        try_files $uri $uri/ /index.php?$args;
        index index.php;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}
